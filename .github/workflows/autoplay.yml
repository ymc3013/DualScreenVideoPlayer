
name: Build AutoPlay Video Player

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Patch video player for autoplay
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"

          python3 <<'PY'
          from pathlib import Path
          import re

          base = Path("VideoPlayerEngine")
          source = base / "source/video_player.c"
          header = base / "include/video_player.h"
          main = base / "source/main.c"
          makefile = base / "Makefile"

          for path in (source, header, main, makefile):
              if not path.is_file():
                  raise SystemExit(f"ERROR: Missing file: {path}")

          h = header.read_text()
          prototype = (
              "bool Vid_play_file("
              "const char* directory, const char* filename);"
          )

          if prototype not in h:
              anchor = "void Vid_init(bool draw);"
              if anchor not in h:
                  raise SystemExit("Cannot find Vid_init declaration")
              h = h.replace(anchor, anchor + "\n" + prototype, 1)
              header.write_text(h)

          c = source.read_text()

          if "bool Vid_play_file(" not in c:
              anchor = "void Vid_exit(bool draw)\n{"
              if anchor not in c:
                  raise SystemExit("Cannot find Vid_exit function")

              function = r'''
          bool Vid_play_file(const char* directory, const char* filename)
          {
              if (!vid_player.inited || !directory || !filename)
                  return false;

              Vid_file* file_data = calloc(1, sizeof(Vid_file));
              if (!file_data)
                  return false;

              snprintf(file_data->directory,
                       sizeof(file_data->directory), "%s", directory);
              snprintf(file_data->name,
                       sizeof(file_data->name), "%s", filename);
              file_data->index = 0;

              uint32_t result = Util_queue_add(
                  &vid_player.decode_thread_command_queue,
                  DECODE_THREAD_PLAY_REQUEST,
                  file_data,
                  QUEUE_OP_TIMEOUT_US,
                  QUEUE_OPTION_NONE
              );

              if (result != DEF_SUCCESS)
              {
                  free(file_data);
                  return false;
              }

              Vid_enter_full_screen(1);
              return true;
          }

          '''

              c = c.replace(anchor, function + anchor, 1)

          marker = "// AUTO-PLAY: ignore controls"

          if marker not in c:
              start = c.find("void Vid_hid(const Hid_info* key)")
              if start < 0:
                  raise SystemExit("Cannot find Vid_hid function")

              home_line = c.find(
                  "vid_player.must_resume_after_home_menu = false;",
                  start
              )
              if home_line < 0:
                  raise SystemExit("Cannot find HOME-menu handling")

              control_pos = c.find(
                  "if(Util_err_query_show_flag())",
                  home_line
              )
              if control_pos < 0:
                  raise SystemExit("Cannot find control-handling section")

              line_start = c.rfind("\n", 0, control_pos) + 1
              indent = c[line_start:control_pos]

              insertion = (
                  indent + marker + "\n"
                  + indent + "return;\n"
              )
              c = c[:line_start] + insertion + c[line_start:]

          source.write_text(c)

          main.write_text("""#include <stdbool.h>
          #include "3ds.h"
          #include "system/menu.h"
          #include "video_player.h"

          int main(void)
          {
              Menu_init();
              Vid_init(false);

              if (!Vid_play_file("sdmc:/Movies/", "test.avi"))
              {
                  Vid_exit(false);
                  Menu_exit();
                  return 1;
              }

              while (aptMainLoop())
              {
                  Menu_main();
              }

              Vid_exit(false);
              Menu_exit();
              return 0;
          }
          """)

          mk = makefile.read_text()

          mk, count = re.subn(
              r"(?m)^TARGET\s*:=.*$",
              "TARGET := DualScreenVideoPlayer",
              mk,
              count=1
          )
          if count != 1:
              raise SystemExit("Cannot update TARGET in Makefile")

          for key, value in (
              ("APP_TITLE", "DualScreenVideoPlayer"),
              ("APP_DESCRIPTION", "Automatic video player"),
              ("APP_AUTHOR", "ymc3013"),
          ):
              mk, count = re.subn(
                  rf"(?m)^{key}\s*:=.*$",
                  f"{key} := {value}",
                  mk,
                  count=1
              )
              if count != 1:
                  raise SystemExit(f"Cannot update {key} in Makefile")

          makefile.write_text(mk)
          print("Autoplay patch applied successfully.")
          PY

      - name: Build 3DSX
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/VideoPlayerEngine"
          make 3dsx

      - name: Commit source changes
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"

          git rev-parse --show-toplevel

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add VideoPlayerEngine

          if ! git diff --cached --quiet; then
            git commit -m "Add automatic video playback mode"
            git push
          fi

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: DualScreenVideoPlayer
          path: |
            VideoPlayerEngine/DualScreenVideoPlayer.3dsx
            VideoPlayerEngine/DualScreenVideoPlayer.smdh
