
name: Build AutoPlay Video Player

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Patch video player for autoplay
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          base = Path("VideoPlayerEngine")
          source = base / "source/video_player.c"
          header = base / "include/video_player.h"
          main = base / "source/main.c"
          makefile = base / "Makefile"

          for p in (source, header, main, makefile):
              if not p.is_file():
                  raise SystemExit(f"Missing file: {p}")

          h = header.read_text()
          prototype = "bool Vid_play_file(const char* directory, const char* filename);"

          if prototype not in h:
              anchor = "void Vid_init(bool draw);"
              if anchor not in h:
                  raise SystemExit("Cannot find Vid_init declaration")
              h = h.replace(anchor, anchor + "\n" + prototype, 1)
              header.write_text(h)

          c = source.read_text()

          if "bool Vid_play_file(" not in c:
              anchor = "void Vid_exit(bool draw)\n{"
              if anchor not in c:
                  raise SystemExit("Cannot find Vid_exit function")

              function = """
          bool Vid_play_file(const char* directory, const char* filename)
          {
              if (!vid_player.inited || !directory || !filename)
                  return false;

              Vid_file* file_data = calloc(1, sizeof(Vid_file));
              if (!file_data)
                  return false;

              snprintf(file_data->directory, sizeof(file_data->directory),
                       "%s", directory);
              snprintf(file_data->name, sizeof(file_data->name),
                       "%s", filename);

              uint32_t result = Util_queue_add(
                  &vid_player.decode_thread_command_queue,
                  DECODE_THREAD_PLAY_REQUEST,
                  file_data,
                  QUEUE_OP_TIMEOUT_US,
                  QUEUE_OPTION_NONE
              );

              if (result != DEF_SUCCESS)
              {
                  free(file_data);
                  return false;
              }

              return true;
          }

          """

              c = c.replace(anchor, function + anchor, 1)

          marker = "// AUTO-PLAY: ignore controls"

          if marker not in c:
              start = c.find("void Vid_hid(const Hid_info* key)")
              if start < 0:
                  raise SystemExit("Cannot find Vid_hid function")

              anchor = (
                  "\t\tvid_player.is_waiting_home_menu = false;\n"
                  "\t\tvid_player.must_resume_after_home_menu = false;\n"
                  "\t}\n"
                  "\tif(Util_err_query_show_flag())"
              )

              pos = c.find(anchor, start)
              if pos < 0:
                  raise SystemExit("Cannot find input-control section")

              replacement = anchor.replace(
                  "\tif(Util_err_query_show_flag())",
                  "\t" + marker + "\n"
                  "\treturn;\n"
                  "\tif(Util_err_query_show_flag())"
              )

              c = c[:pos] + c[pos:].replace(anchor, replacement, 1)

          source.write_text(c)

          main.write_text("""#include <stdbool.h>
          #include "3ds.h"
          #include "system/menu.h"
          #include "video_player.h"

          int main(void)
          {
              Menu_init();
              Vid_init(false);

              if (!Vid_play_file("sdmc:/Movies/", "test.avi"))
                  Menu_set_must_exit_flag(true);

              while (aptMainLoop())
              {
                  if (Menu_query_must_exit_flag())
                      break;

                  Menu_main();
              }

              Menu_exit();
              return 0;
          }
          """)

          mk = makefile.read_text()

          mk, count = re.subn(
              r"(?m)^TARGET\s*:=.*$",
              "TARGET := DualScreenVideoPlayer",
              mk,
              count=1
          )
          if count != 1:
              raise SystemExit("Cannot update application target")

          mk = re.sub(
              r"(?m)^APP_TITLE\s*:=.*$",
              "APP_TITLE := DualScreenVideoPlayer",
              mk,
              count=1
          )
          mk = re.sub(
              r"(?m)^APP_DESCRIPTION\s*:=.*$",
              "APP_DESCRIPTION := Automatic video player",
              mk,
              count=1
          )
          mk = re.sub(
              r"(?m)^APP_AUTHOR\s*:=.*$",
              "APP_AUTHOR := ymc3013",
              mk,
              count=1
          )

          makefile.write_text(mk)
          print("Auto-play patch applied successfully.")
          PY

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VideoPlayerEngine
          if ! git diff --cached --quiet; then
            git commit -m "Add automatic video playback mode"
            git push
          fi

      - name: Build 3DSX
        run: make -C VideoPlayerEngine 3dsx

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: DualScreenVideoPlayer
          path: |
            VideoPlayerEngine/DualScreenVideoPlayer.3dsx
            VideoPlayerEngine/DualScreenVideoPlayer.smdh
