
name: Build 3DS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout DualScreenVideoPlayer
        uses: actions/checkout@v4

      - name: Download Video Player source
        uses: actions/checkout@v4
        with:
          repository: Core-2-Extreme/Video_player_for_3DS
          path: Video_player_for_3DS

      - name: Check tools
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"
          test -x "$DEVKITARM/bin/arm-none-eabi-gcc"
          test -f Video_player_for_3DS/library/lib/libavcodec.a
          test -f Video_player_for_3DS/Makefile

      - name: Build DualScreenVideoPlayer
        run: make

      - name: Build reference video player
        run: make -C Video_player_for_3DS 3dsx

      - name: Upload DualScreenVideoPlayer
        uses: actions/upload-artifact@v4
        with:
          name: DualScreenVideoPlayer-3DSX
          path: |
            DualScreenVideoPlayer.3dsx
            DualScreenVideoPlayer.smdh

      - name: Upload reference player
        uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-Reference
          path: |
            Video_player_for_3DS/*.3dsx
            Video_player_for_3DS/*.smdh
