
name: Build 3DS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check tools
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"
          ls "$DEVKITPRO"
          test -x "$DEVKITARM/bin/arm-none-eabi-gcc"

      - name: Build 3DSX
        run: make

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: DualScreenVideoPlayer-3DSX
          path: |
            DualScreenVideoPlayer.3dsx
            DualScreenVideoPlayer.smdh
