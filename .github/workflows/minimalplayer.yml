name: MinimalPlayer Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source files
        run: |
          test -f MinimalPlayer/Makefile
          test -f MinimalPlayer/source/main.c
          test -f MinimalPlayer/source/video.c
          test -f MinimalPlayer/source/video.h
          test -f MinimalPlayer/source/audio.c
          test -f MinimalPlayer/source/audio.h
          echo "Source files OK"

      - name: Compile MinimalPlayer
        run: |
          make -C MinimalPlayer
          echo "Compilation finished"

      - name: Locate build outputs
        id: outputs
        if: always()
        run: |
          find . -type f \( -name "*.3dsx" -o -name "*.elf" -o -name "*.smdh" \) -print
          if find . -type f -name "*.3dsx" -print -quit | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload 3DSX
        if: steps.outputs.outputs == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MinimalPlayer-3DSX
          path: '**/*.3dsx'
          if-no-files-found: error