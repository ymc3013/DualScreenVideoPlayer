name: DualScreenVideoPlayer Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install development tools
        run: |
          dkp-pacman -Sy --noconfirm
          dkp-pacman -S --needed --noconfirm 3ds-dev

      - name: Prepare source files
        run: |
          set -eu

          test -f MinimalPlayer/source/main.c
          test -f MinimalPlayer/source/video.c
          test -f MinimalPlayer/source/video.h
          test -f MinimalPlayer/source/audio.c
          test -f MinimalPlayer/source/audio.h
          test -f Makefile

          cp MinimalPlayer/source/*.c .
          cp MinimalPlayer/source/*.h .

          echo "Sources preparees :"
          ls -l main.c video.c video.h audio.c audio.h

      - name: Compile application
        run: |
          set -eu
          make clean
          make all

      - name: Verify output
        run: |
          test -s DualScreenVideoPlayer.3dsx
          ls -lh DualScreenVideoPlayer.3dsx

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: DualScreenVideoPlayer
          path: DualScreenVideoPlayer.3dsx
          if-no-files-found: error