name: DualScreenVideoPlayer Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nintendo 3DS development tools
        run: |
          dkp-pacman -Sy --noconfirm
          dkp-pacman -S --noconfirm 3ds-dev
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"

      - name: Generate project files
        shell: bash
        run: |
          set -eu

          # Recuperer les sources deja presentes dans le depot.
          if [ -d MinimalPlayer/source ]; then
            cp MinimalPlayer/source/*.c .
            cp MinimalPlayer/source/*.h .
          fi

          # Verifier que toutes les sources existent.
          for f in main.c video.c video.h audio.c audio.h; do
            if [ ! -f "$f" ]; then
              echo "::error::Fichier source manquant : $f"
              exit 1
            fi
          done

          # Generer le Makefile a la racine.
          cat > Makefile <<'MAKEFILE'
          .SUFFIXES:
          .DEFAULT_GOAL := all

          TARGET := DualScreenVideoPlayer
          BUILD := build
          SOURCES := .
          INCLUDES := .

          ARCH := -march=armv6k -mtune=mpcore -mfloat-abi=hard -mtp=soft

          CFLAGS := -g -Wall -Wextra -O2 -mword-relocations
          CFLAGS += -ffunction-sections -fdata-sections $(ARCH)
          CFLAGS += -D__3DS__

          CXXFLAGS := $(CFLAGS)
          ASFLAGS := $(ARCH)

          LDFLAGS := -specs=3dsx.specs -g $(ARCH)
          LDFLAGS += -Wl,--gc-sections

          LIBS := -lctru -lm

          APP_TITLE := DualScreenVideoPlayer
          APP_DESCRIPTION := Dual screen video player
          APP_AUTHOR := ymc3013

          include $(DEVKITARM)/3ds_rules
          MAKEFILE

          echo "Fichiers du projet :"
          ls -la
          echo "Makefile genere."

      - name: Compile Nintendo 3DS application
        run: make

      - name: Locate compiled application
        if: always()
        run: |
          find . -type f \( -name "*.3dsx" -o -name "*.elf" \) -print

      - name: Upload application
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DualScreenVideoPlayer
          path: DualScreenVideoPlayer.3dsx
          if-no-files-found: error