name: MinimalPlayer Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f MinimalPlayer/Makefile
          test -f MinimalPlayer/main.c
          test -f MinimalPlayer/video.c
          test -f MinimalPlayer/audio.c
          echo "Project files found."

      - name: Compile MinimalPlayer
        run: make -C MinimalPlayer

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: MinimalPlayer-3DSX
          path: MinimalPlayer/MinimalPlayer.3dsx
          if-no-files-found: error