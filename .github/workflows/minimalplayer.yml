name: Build MinimalPlayer

'on': push: workflow_dispatch:

jobs: build: runs-on: ubuntu-latest container: image: devkitpro/devkitarm:latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Build MinimalPlayer
    run: make -C MinimalPlayer

  - name: Upload 3DSX
    uses: actions/upload-artifact@v4
    with:
      name: MinimalPlayer
      path: MinimalPlayer/MinimalPlayer.3dsx