name: Build MinimalPlayer

on: workflow_dispatch: push: paths: - "MinimalPlayer/**" - ".github/workflows/minimalplayer.yml"

jobs: build: runs-on: ubuntu-latest container: devkitpro/devkitarm:latest

steps: - name: Checkout repository uses: actions/checkout@v4 - name: Build MinimalPlayer run: make -C MinimalPlayer - name: Upload 3DSX uses: actions/upload-artifact@v4 with: name: MinimalPlayer path: MinimalPlayer/MinimalPlayer.3dsx 