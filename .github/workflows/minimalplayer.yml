name: MinimalPlayer Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source files
        run: |
          echo "Checking project files..."
          ls -la MinimalPlayer
          ls -la MinimalPlayer/source
          test -f MinimalPlayer/Makefile
          test -f MinimalPlayer/source/main.c
          test -f MinimalPlayer/source/video.c
          test -f MinimalPlayer/source/video.h
          test -f MinimalPlayer/source/audio.c
          test -f MinimalPlayer/source/audio.h

      - name: Compile MinimalPlayer
        run: make -C MinimalPlayer

      - name: Search build outputs
        if: always()
        run: |
          echo "Searching for compiled files..."
          find . -type f \( \
            -name "*.3dsx" -o \
            -name "*.elf" -o \
            -name "*.smdh" \
          \) -print
          echo "Build directory:"
          ls -la MinimalPlayer/build || true

      - name: Upload 3DSX
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MinimalPlayer-3DSX
          path: |
            MinimalPlayer/**/*.3dsx
            MinimalPlayer/*.3dsx
          if-no-files-found: error