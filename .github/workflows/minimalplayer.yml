name: MinimalPlayer Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          test -f MinimalPlayer/Makefile
          test -f MinimalPlayer/source/main.c
          test -f MinimalPlayer/source/video.c
          test -f MinimalPlayer/source/video.h
          test -f MinimalPlayer/source/audio.c
          test -f MinimalPlayer/source/audio.h
          echo "Tous les fichiers source sont presents."

      - name: Compile MinimalPlayer
        run: make -C MinimalPlayer

      - name: Find generated files
        if: always()
        run: |
          echo "Recherche des fichiers compiles..."
          find MinimalPlayer -type f \( \
            -name "*.3dsx" -o \
            -name "*.elf" -o \
            -name "*.smdh" \
          \) -print

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: MinimalPlayer-3DSX
          path: MinimalPlayer/**/*.3dsx
          if-no-files-found: error